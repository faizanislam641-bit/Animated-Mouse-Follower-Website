<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAIZAN • Mouse Follower Playground</title>
<meta name="description" content="Fun interactive website by FAIZAN — Mouse followers, animations & more!" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Poppins', sans-serif; background: #0a0a1a; }

  /* ===== Animated Background ===== */
  #bgCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
  }
  .gradient-overlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(120,0,255,0.25), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(0,200,255,0.2), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,0,150,0.15), transparent 60%);
    animation: hueShift 15s ease-in-out infinite;
  }
  @keyframes hueShift {
    0%,100% { filter: hue-rotate(0deg); }
    50% { filter: hue-rotate(90deg); }
  }

  /* ===== Floating Orbs ===== */
  .orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 2;
    filter: blur(40px); opacity: 0.5; mix-blend-mode: screen;
  }
  .orb.o1 { width: 350px; height: 350px; background: #ff00aa; animation: float1 18s ease-in-out infinite; }
  .orb.o2 { width: 280px; height: 280px; background: #00d4ff; animation: float2 22s ease-in-out infinite; }
  .orb.o3 { width: 400px; height: 400px; background: #7b00ff; animation: float3 25s ease-in-out infinite; }
  @keyframes float1 { 0%,100%{top:10%;left:5%;} 50%{top:60%;left:70%;} }
  @keyframes float2 { 0%,100%{top:70%;left:60%;} 50%{top:20%;left:15%;} }
  @keyframes float3 { 0%,100%{top:40%;left:80%;} 50%{top:75%;left:30%;} }

  /* ===== Running FAIZAN text ===== */
  .running-name {
    position: fixed; top: 50%; left: 0; width: 100%;
    transform: translateY(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(80px, 18vw, 240px);
    font-weight: 900;
    letter-spacing: 12px;
    white-space: nowrap;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,0.12);
    text-stroke: 2px rgba(255,255,255,0.12);
    pointer-events: none;
    z-index: 3;
    opacity: 0.55;
    animation: runName 22s linear infinite;
  }
  .running-name span {
    background: linear-gradient(90deg, #ff00aa, #00d4ff, #7b00ff, #ff00aa);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 0;
    animation: shine 4s linear infinite;
  }
  @keyframes runName {
    0% { transform: translate(0, -50%); }
    100% { transform: translate(-50%, -50%); }
  }
  @keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* ===== Top Left Credit ===== */
  .credit {
    position: fixed; top: 18px; left: 18px; z-index: 10;
    padding: 10px 18px; border-radius: 40px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff; font-size: 13px; font-weight: 600; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 0 25px rgba(255,0,170,0.4);
    animation: glowPulse 3s ease-in-out infinite;
  }
  .credit .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #00ff88;
    box-shadow: 0 0 10px #00ff88; animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  @keyframes glowPulse {
    0%,100% { box-shadow: 0 0 25px rgba(255,0,170,0.4); }
    50% { box-shadow: 0 0 40px rgba(0,212,255,0.7); }
  }
  .credit b {
    background: linear-gradient(90deg,#ff00aa,#00d4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ===== Control Panel ===== */
  .panel-toggle {
    position: fixed; top: 18px; right: 18px; z-index: 20;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, #ff00aa, #7b00ff);
    border: none; color: #fff; font-size: 22px; cursor: pointer;
    box-shadow: 0 0 30px rgba(255,0,170,0.7);
    transition: transform 0.3s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .panel-toggle:hover { transform: scale(1.1) rotate(15deg); }
  .panel-toggle.active { transform: rotate(45deg); }

  .panel {
    position: fixed; top: 85px; right: 18px; z-index: 19;
    width: min(340px, calc(100vw - 36px));
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 20px;
    background: rgba(15,10,35,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(123,0,255,0.3);
    color: #fff;
    transform: translateX(120%);
    opacity: 0; pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .panel.open { transform: translateX(0); opacity: 1; pointer-events: auto; }

  .panel h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px; letter-spacing: 2px; margin-bottom: 4px;
    background: linear-gradient(90deg,#ff00aa,#00d4ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .panel p.hint { font-size: 11px; color: #aaa; margin-bottom: 14px; }

  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    color: #7b8cff; margin: 14px 0 8px; font-weight: 600;
  }

  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .emoji-btn {
    aspect-ratio: 1; font-size: 22px; border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease; color: #fff;
    user-select: none;
  }
  .emoji-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }
  .emoji-btn.selected {
    background: linear-gradient(135deg, #ff00aa, #7b00ff);
    border-color: #fff;
    box-shadow: 0 0 18px rgba(255,0,170,0.8);
    transform: scale(1.08);
  }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button {
    flex: 1; padding: 10px; border-radius: 10px; border: none;
    font-weight: 600; font-size: 12px; cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-clear { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-clear:hover { background: rgba(255,0,0,0.4); }
  .btn-all {
    background: linear-gradient(135deg,#00d4ff,#7b00ff); color: #fff;
  }
  .btn-all:hover { filter: brightness(1.2); }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .slider-row label { font-size: 11px; color: #aaa; min-width: 70px; }
  .slider-row input[type=range] { flex: 1; accent-color: #ff00aa; }

  /* ===== Connect Buttons ===== */
  .connect {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 15; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    padding: 0 12px;
  }
  .connect a {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 40px;
    text-decoration: none; color: #fff; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  .connect a:hover { transform: translateY(-4px) scale(1.05); }
  .connect a.fb:hover { background: #1877f2; box-shadow: 0 10px 30px rgba(24,119,242,0.6); }
  .connect a.wa:hover { background: #25d366; box-shadow: 0 10px 30px rgba(37,211,102,0.6); }
  .connect a.pf:hover { background: #ff00aa; box-shadow: 0 10px 30px rgba(255,0,170,0.6); }
  .connect svg { width: 16px; height: 16px; fill: currentColor; }

  /* ===== Cursor Follower Layer ===== */
  #followers {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden;
  }
  .follower {
    position: absolute; top: 0; left: 0;
    font-size: 28px; line-height: 1;
    will-change: transform;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
    pointer-events: none;
    user-select: none;
  }

  /* ===== Custom cursor ===== */
  body { cursor: crosshair; }

  /* ===== Mobile ===== */
  @media (max-width: 640px) {
    .credit { font-size: 11px; padding: 8px 14px; top: 12px; left: 12px; }
    .panel-toggle { width: 46px; height: 46px; top: 12px; right: 12px; font-size: 18px; }
    .panel { top: 70px; right: 12px; padding: 16px; }
    .connect { gap: 6px; bottom: 12px; }
    .connect a { padding: 9px 14px; font-size: 11px; }
    .running-name { letter-spacing: 6px; }
  }
  @media (max-width: 380px) {
    .connect a span { display: none; }
    .connect a { padding: 12px; border-radius: 50%; }
  }
</style>
</head>

<script>
/* ============================================================
   FAIZAN's Animated Mouse Follower Playground
   ============================================================ */

/* ---------- 1) BACKGROUND PARTICLE CANVAS ---------- */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const PARTICLE_COUNT = window.innerWidth < 700 ? 40 : 90;
const particles = [];
const colors = ['#ff00aa', '#00d4ff', '#7b00ff', '#00ff88', '#ffaa00'];

class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 20;
    this.r = Math.random() * 2 + 0.5;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = -Math.random() * 0.8 - 0.2;
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.alpha = Math.random() * 0.6 + 0.3;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.y < -20 || this.x < -20 || this.x > W + 20) this.reset(false);
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.alpha;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
}
for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

/* Connecting lines */
function drawLines() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 120) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(140,120,255,${0.15 * (1 - d / 120)})`;
        ctx.lineWidth = 0.6;
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
}

function animateBg() {
  ctx.fillStyle = 'rgba(10,10,26,0.35)';
  ctx.fillRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  drawLines();
  requestAnimationFrame(animateBg);
}
animateBg();

/* ---------- 2) EMOJI / ANIMAL LIST ---------- */
const EMOJIS = [
  { id: 'spider',   ch: '🕷️', name: 'Spider' },
  { id: 'snake',    ch: '🐍', name: 'Snake' },
  { id: 'butterfly',ch: '🦋', name: 'Butterfly' },
  { id: 'cat',      ch: '🐱', name: 'Cat' },
  { id: 'dog',      ch: '🐶', name: 'Dog' },
  { id: 'dragon',   ch: '🐲', name: 'Dragon' },
  { id: 'unicorn',  ch: '🦄', name: 'Unicorn' },
  { id: 'bee',      ch: '🐝', name: 'Bee' },
  { id: 'fish',     ch: '🐠', name: 'Fish' },
  { id: 'octopus',  ch: '🐙', name: 'Octopus' },
  { id: 'bat',      ch: '🦇', name: 'Bat' },
  { id: 'ghost',    ch: '👻', name: 'Ghost' },
  { id: 'alien',    ch: '👽', name: 'Alien' },
  { id: 'fire',     ch: '🔥', name: 'Fire' },
  { id: 'star',     ch: '⭐', name: 'Star' },
  { id: 'heart',    ch: '💖', name: 'Heart' },
  { id: 'rocket',   ch: '🚀', name: 'Rocket' },
  { id: 'crown',    ch: '👑', name: 'Crown' },
  { id: 'diamond',  ch: '💎', name: 'Diamond' },
  { id: 'lightning',ch: '⚡', name: 'Lightning' }
];

/* Default selected */
let selectedIds = new Set(['spider']);

/* Render emoji grid */
const emojiGrid = document.getElementById('emojiGrid');
EMOJIS.forEach(e => {
  const btn = document.createElement('button');
  btn.className = 'emoji-btn';
  btn.dataset.id = e.id;
  btn.title = e.name;
  btn.textContent = e.ch;
  if (selectedIds.has(e.id)) btn.classList.add('selected');
  btn.addEventListener('click', () => toggleEmoji(e.id, btn));
  emojiGrid.appendChild(btn);
});

function toggleEmoji(id, btn) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
    btn.classList.remove('selected');
  } else {
    selectedIds.add(id);
    btn.classList.add('selected');
  }
  rebuildFollowers();
}

document.getElementById('selectAll').addEventListener('click', () => {
  selectedIds = new Set(EMOJIS.map(e => e.id));
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.add('selected'));
  rebuildFollowers();
});
document.getElementById('clearAll').addEventListener('click', () => {
  selectedIds.clear();
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
  rebuildFollowers();
});

/* Panel toggle */
const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');
panelToggle.addEventListener('click', () => {
  panel.classList.toggle('open');
  panelToggle.classList.toggle('active');
});

/* ---------- 3) FOLLOWERS ---------- */
const followersLayer = document.getElementById('followers');
let followers = [];
let followerSize = 30;
let trailCount = 3; // how many of each selected emoji

const sizeRange = document.getElementById('sizeRange');
const trailRange = document.getElementById('trailRange');

sizeRange.addEventListener('input', e => {
  followerSize = +e.target.value;
  updateFollowerStyles();
});
trailRange.addEventListener('input', e => {
  trailCount = +e.target.value;
  rebuildFollowers();
});

/* Mouse position (target) */
const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

function updateMouse(x, y) { mouse.x = x; mouse.y = y; }

window.addEventListener('mousemove', e => updateMouse(e.clientX, e.clientY));
window.addEventListener('touchmove', e => {
  if (e.touches.length) {
    updateMouse(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: true });
window.addEventListener('touchstart', e => {
  if (e.touches.length) {
    updateMouse(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: true });

/* Rebuild follower DOM elements */
function rebuildFollowers() {
  followersLayer.innerHTML = '';
  followers = [];

  const selected = EMOJIS.filter(e => selectedIds.has(e.id));
  if (selected.length === 0) return;

  // Round-robin: for each trail position, cycle through selected emojis
  const total = selected.length * trailCount;

  for (let i = 0; i < total; i++) {
    const emojiData = selected[i % selected.length];
    const el = document.createElement('div');
    el.className = 'follower';
    el.textContent = emojiData.ch;
    el.style.fontSize = followerSize + 'px';
    followersLayer.appendChild(el);

    followers.push({
      el,
      x: mouse.x,
      y: mouse.y,
      // delay increases down the chain → trailing effect
      speed: 0.18 / (1 + i * 0.15),
      // slight offset so they don't perfectly overlap
      offsetAngle: (i / total) * Math.PI * 2,
      offsetRadius: 8 + i * 3,
      wobble: Math.random() * Math.PI * 2
    });
  }
}

function updateFollowerStyles() {
  followers.forEach(f => { f.el.style.fontSize = followerSize + 'px'; });
}

/* Animate followers with smooth trailing */
function animateFollowers() {
  const time = performance.now() * 0.001;
  let prev = { x: mouse.x, y: mouse.y };

  followers.forEach((f, idx) => {
    // Each follower chases the one before it → snake/trail effect
    const tx = prev.x;
    const ty = prev.y;

    // Smooth easing
    const sp = Math.min(0.35, f.speed + 0.05);
    f.x += (tx - f.x) * sp;
    f.y += (ty - f.y) * sp;

    // Wobble for organic motion
    f.wobble += 0.08;
    const wobX = Math.cos(f.wobble) * 3;
    const wobY = Math.sin(f.wobble * 1.3) * 3;

    // Add small offset per follower (so many at once don't sit on top of each other)
    const offX = Math.cos(f.offsetAngle + time) * f.offsetRadius * 0.4;
    const offY = Math.sin(f.offsetAngle + time) * f.offsetRadius * 0.4;

    const finalX = f.x + wobX + offX - followerSize / 2;
    const finalY = f.y + wobY + offY - followerSize / 2;

    f.el.style.transform = `translate3d(${finalX}px, ${finalY}px, 0) rotate(${wobX * 1.2}deg)`;

    // Next follower chases this one
    prev = { x: f.x, y: f.y };
  });

  requestAnimationFrame(animateFollowers);
}

/* Init */
rebuildFollowers();
animateFollowers();

/* Rebuild on resize (keeps DOM clean) */
window.addEventListener('resize', () => {
  // nothing to rebuild; CSS handles it
});

/* Prevent context menu annoying, optional */
// window.addEventListener('contextmenu', e => e.preventDefault());
</script>
